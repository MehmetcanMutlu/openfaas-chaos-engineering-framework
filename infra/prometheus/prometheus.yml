global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: openfaas-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway.openfaas:8080

  - job_name: chaos-functions-openfaas
    static_configs:
      - targets:
          - gateway.openfaas:8080
        labels:
          function_name: order-validator
      - targets:
          - gateway.openfaas:8080
        labels:
          function_name: inventory-checker
      - targets:
          - gateway.openfaas:8080
        labels:
          function_name: payment-processor
      - targets:
          - gateway.openfaas:8080
        labels:
          function_name: notification-dispatcher
    relabel_configs:
      - source_labels: [function_name]
        target_label: __metrics_path__
        regex: (.+)
        replacement: /function/$1/metrics

  - job_name: chaos-functions-local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          function_name: order-validator
      - targets: ["host.docker.internal:8082"]
        labels:
          function_name: inventory-checker
      - targets: ["host.docker.internal:8083"]
        labels:
          function_name: payment-processor
      - targets: ["host.docker.internal:8084"]
        labels:
          function_name: notification-dispatcher
